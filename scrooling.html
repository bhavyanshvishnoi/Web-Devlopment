<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern JS Features</title>

<style>

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
transition:0.4s;
}

.dark{
background:#121212;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:rgba(0,0,0,0.3);
backdrop-filter: blur(10px);
position:sticky;
top:0;
}

nav a{
color:white;
text-decoration:none;
margin:10px;
font-weight:bold;
}

nav a:hover{
color:#ffd369;
}

.toggle-btn{
padding:8px 16px;
border:none;
border-radius:20px;
cursor:pointer;
background:white;
color:black;
font-weight:bold;
transition:0.3s;
}

.toggle-btn:hover{
transform:scale(1.1);
}

section{
padding:80px 20px;
text-align:center;
min-height:100vh;
}


.hero{
font-size:40px;
font-weight:bold;
margin-top:50px;
}

.card{
background:white;
color:black;
max-width:500px;
margin:auto;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
}

form{
display:flex;
flex-direction:column;
gap:12px;
}

input{
padding:10px;
border-radius:5px;
border:1px solid #ccc;
}

.submit-btn{
background:#667eea;
color:white;
border:none;
padding:10px;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

.submit-btn:hover{
background:#5a67d8;
}

.error{
color:red;
font-size:13px;
text-align:left;
}

</style>

</head>

<body>

<nav>

<div>
<a href="#home">Home</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</div>

<button class="toggle-btn" onclick="toggleDark()">🌙 Dark Mode</button>

</nav>

<section id="home">

<h1 class="hero">Modern JavaScript Features</h1>

<p>Dark Mode • Form Validation • Smooth Scrolling</p>

</section>

<section id="about">

<div class="card">

<h2>About This Project</h2>

<p>
This small project demonstrates some useful JavaScript features like 
dark mode toggle, form validation and smooth scrolling navigation.
</p>

</div>

</section>

<section id="contact">

<div class="card">

<h2>Contact Form</h2>

<form onsubmit="return validateForm()">

<input type="text" id="name" placeholder="Enter your name">
<span id="nameError" class="error"></span>

<input type="email" id="email" placeholder="Enter your email">
<span id="emailError" class="error"></span>

<input type="password" id="password" placeholder="Enter password">
<span id="passError" class="error"></span>

<button class="submit-btn">Submit</button>

</form>

</div>

</section>

<script>

function toggleDark(){
document.body.classList.toggle("dark");
}

function validateForm(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let valid=true;

if(name.trim()==""){
document.getElementById("nameError").innerText="Name required";
valid=false;
}else{
document.getElementById("nameError").innerText="";
}

let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

if(!email.match(emailPattern)){
document.getElementById("emailError").innerText="Enter valid email";
valid=false;
}else{
document.getElementById("emailError").innerText="";
}


if(password.length<6){
document.getElementById("passError").innerText="Password must be 6+ characters";
valid=false;
}else{
document.getElementById("passError").innerText="";
}

return valid;

}

</script>

</body>
</html>
